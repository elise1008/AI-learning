{% extends "base.html" %}
{% block title %}导入数据{% endblock %}
{% block content %}
<div class="page-header"><h1>导入数据</h1></div>

<div class="card">
    <form id="import-form" enctype="multipart/form-data">
        <div class="form-group">
            <label>目标业务</label>
            <select name="biz" id="import-biz" required>
                <option value="">-- 选择业务 --</option>
                {% for biz in businesses %}
                <option value="{{ biz }}">{{ biz }}</option>
                {% endfor %}
                <option value="master_pool">地址总表</option>
                <option value="router_loopback">路由器Loopback表</option>
                <option value="router_link">路由器链路表</option>
            </select>
        </div>
        <div class="form-group">
            <label>选择文件 (xlsx / csv)</label>
            <input type="file" name="file" accept=".xlsx,.xls,.csv" required>
        </div>
        <button type="submit" class="btn btn-primary">开始导入</button>
    </form>
</div>

<div id="import-result" style="margin-top:20px"></div>

<script>
document.getElementById('import-form').onsubmit = function(e) {
    e.preventDefault();
    var formData = new FormData(this);
    var btn = this.querySelector('button');
    btn.disabled = true;
    btn.textContent = '导入中...';
    fetch('/api/import', {method:'POST', body:formData})
        .then(r=>r.json()).then(function(d){
            var html = '<div class="card"><h3>' + (d.success ? '导入结果' : '导入失败') + '</h3>';
            html += '<p><strong>' + d.message + '</strong></p>';
            if(d.imported) html += '<p>成功导入: ' + d.imported + ' 条</p>';
            if(d.skipped) html += '<p>跳过: ' + d.skipped + ' 条</p>';
            if(d.errors && d.errors.length) {
                html += '<div style="margin-top:10px"><h4>错误详情:</h4><ul>';
                for(var i=0;i<d.errors.length;i++) html += '<li>' + d.errors[i] + '</li>';
                html += '</ul></div>';
            }
            html += '</div>';
            document.getElementById('import-result').innerHTML = html;
            btn.disabled = false;
            btn.textContent = '开始导入';
        });
};
</script>
{% endblock %}
